id: walls-reference-choice-and-side
title: The wall's reference line is picked from a short list, and its side can be swapped before drawing
status: proposed
given: |
  The wall tool, with a build-up of render 20, insulation 140, concrete 200
  (load-bearing), plaster 15, listed from the exterior face.
when: |
  The architect picks the reference line in the tool's settings or in a
  wall's properties, and swaps the side the wall lies on before drawing.
expect:
  - The choice is one compact list - exterior face, centre, interior face,
    then the exterior face, centre and interior face of the load-bearing
    layers. No left or right is named anywhere.
  - Centre of the load-bearing layers puts the line in the middle of the
    concrete - 260 from the exterior face in this build-up.
  - Next to the list, a button swaps the side; in the tool's settings it
    applies to the next walls drawn - drawn anticlockwise, they still have
    their exterior face outside. On a drawn wall it flips the wall, as
    before, in one undo step.
  - The preview shows the wall on the side it will be built.
  - Changing the build-up never moves the reference line.

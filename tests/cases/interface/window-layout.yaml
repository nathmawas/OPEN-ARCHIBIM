id: window-layout
title: The window has a menu and the drawing aids at the top, the tools on the left, the settings on the right and the display at the bottom
status: proposed
given: |
  The application is open on a project.
when: |
  The architect looks for a command, a tool, a setting or a way to change
  what the screen shows.
expect:
  - Top - a menu bar - File, Edit, View, Help. Edit holds undo, redo and
    delete, each greyed when it cannot act, with its keyboard shortcut.
    View holds fit to window, zoom in and out, plan, 3D or both, the placed
    guides, and the drawing aids bar, the tools and settings panels, each
    of which can be hidden.
    Help tells the name, licence and version.
  - File shows new, open, save, save as and IFC export greyed, the pointer
    on them saying they are not there yet; quit works.
  - Quitting, by the menu, Ctrl+Q or the window's close button, while the
    project has changes, warns that nothing is saved and asks to quit
    anyway or cancel; it never quits silently.
  - Left - only the tools that work, in groups - selection, the elements
    of the model, the guides. The window or door choice shows under the
    opening tool when it is active.
  - Under the menu - a bar of drawing aids in a row: what the pointer
    snaps to, the snapped angles, the divisions, halfway and the reference.
  - Right - the active tool's settings, or the selected element's
    properties.
  - Bottom - a status line with the pointer's x and y in millimetres in
    the plan and the hint of the tool, and a display bar - plan, 3D or
    both, fit to window, zoom out and in, the plan's approximate size on
    screen as "Screen 1:N" (not the drawing's scale), and the placed
    guides shown or hidden.
  - Not yet - a language menu (the language is chosen
    at launch), a renovation filter and layers shown or hidden in the
    display bar, the drawing's own scale.

id: materials-by-family
title: Materials are picked by family from a base library
status: proposed
given: |
  A new project, or the demonstration house, with the starting library of
  materials.
when: |
  The architect picks the material of a layer of a wall, a slab or a roof.
expect:
  - Each material is filed in one family - masonry, insulation, timber frame
    and roof framing, metal frame, air, membrane, facade finish, cladding,
    interior lining, roof covering, other. The family only sorts the list:
    any material can go on any layer, never refused.
  - The material list shows the families as headings, with their
    materials under each, and opens on the family matching the layer's
    role (insulation on an insulation layer, air on an air gap...).
  - The starting library has generic materials in every family - one
    material per kind, its colour, bond, binder or species being
    parameters later, never a new material - and a few traditional ones
    (stone, rammed earth, hemp and lime, straw, slate, thatch).
  - An air gap layer takes an air material and keeps its thickness, like
    any other layer.
  - Names come from the language pack; a material the architect names
    shows as typed.
  - Not yet - parameters of a material (bond, colour, species); a library
    per country; the family in IFC export.

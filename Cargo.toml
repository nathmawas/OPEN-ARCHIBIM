[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/nathmawas/OPEN-ARCHIBIM"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
archibim-model = { path = "crates/archibim-model" }
archibim-geometry = { path = "crates/archibim-geometry" }
archibim-commands = { path = "crates/archibim-commands" }
archibim-render = { path = "crates/archibim-render" }
archibim-ui = { path = "crates/archibim-ui" }
